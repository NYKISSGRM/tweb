name: Build & Deploy NYKISS Gram Web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec vite build
        env:
          VITE_NYKISS_SHA: ${{ github.sha }}
          VITE_API_ID: 1025907
          VITE_API_HASH: 452b0359b988148995f22ff0f4229750
          VITE_PUSH_SERVER_KEY: BB3JzmQIBTl8ZdTmLzhkZVnoYxoSvUmCe1CqqF53u2j0WbEFo2m--mOBagroDFdqMeESfz3ue1Z1e5PTIxMYH_g
          VITE_VERSION: "2.2"
          VITE_VERSION_FULL: "2.2 (1)"
          VITE_BUILD: 1
          VITE_LANG_PACK_VERSION: 342804
          VITE_MTPROTO_AUTO: 1
          VITE_MTPROTO_HAS_HTTP: 1
          VITE_MTPROTO_HAS_WS: 1

      # `vite build` runs with copyPublicDir:false, so the static assets that
      # live in public/assets (fonts, tgico icon font, images, tgs intro
      # stickers, audio) never land in dist. The upstream build.js copies them;
      # this CI calls vite directly, so copy them in explicitly. Without this
      # every /assets/* request 404s and the app paints a black screen.
      - name: Copy static assets into dist
        run: cp -r public/assets dist/assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
